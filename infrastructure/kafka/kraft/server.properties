# ============================
# Kafka KRaft Server - Development
# ============================

# Roles de este nodo
process.roles=broker,controller
node.id=1

# Quorum del controlador
controller.quorum.voters=1@kafka:9093
controller.listener.names=CONTROLLER

# Listeners
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT

# Directorio de logs
log.dirs=/var/lib/kafka/data

# Factores de replicación (dev)
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Heap memory
# (esto se puede dejar también desde la variable de entorno KAFKA_HEAP_OPTS)
# kafka.heap.opts=-Xmx512M -Xms512M

# ============================
# Opcionales para desarrollo
# ============================

# Deshabilitar advertencias de métricas sobre nombres de topics
metric.reporters=

# Tiempo de espera y límites de control (puedes ajustar si tu host es lento)
controller.socket.timeout.ms=30000
controller.connection.max.idle.ms=300000
