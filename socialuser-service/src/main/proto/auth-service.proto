syntax = "proto3";
package com.socialseed.socialuser-service;

import "google/protobuf/timestamp.proto";

service AuthService {
  // Login with email/username + password
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh tokens
  rpc Refresh(RefreshRequest) returns (LoginResponse);

  // Introspect a token (returns claims) — internal use
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse);

  // Validate credentials (used if socialuser-service needs an immediate check)
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);
}

message LoginRequest {
  string usernameOrEmail = 1;
  string password = 2;
  string deviceId = 3; // optional
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
  int64 expiresIn = 3; // seconds for access token
}

message RefreshRequest {
  string refreshToken = 1;
}

message IntrospectRequest {
  string accessToken = 1;
}

message IntrospectResponse {
  bool active = 1;
  string userId = 2;
  repeated string roles = 3;
  map<string,string> claims = 4;
  google.protobuf.Timestamp exp = 5;
}

message ValidateCredentialsRequest {
  string usernameOrEmail = 1;
  string password = 2;
}

message ValidateCredentialsResponse {
  bool valid = 1;
  string userId = 2;
}