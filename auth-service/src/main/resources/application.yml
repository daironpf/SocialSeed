server:
  port: 8081

spring:
  application:
    name: auth-service
  grpc:
    server:
      enabled: false
    client:
      local-grpc-server:
        address: 'static://127.0.0.1:9000'
        enableKeepAlive: true
        keepAliveWithoutCalls: true
        negotiationType: plaintext
      channels:
        user:
          address: 'static://localhost:9090'
