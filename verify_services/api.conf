# SocialSeed E2E Testing Framework - Configuration File
# ======================================================
# 
# This file centralizes all API endpoint configurations and testing parameters.
# It supports both direct service connections and API Gateway configurations.
#
# Usage:
#   1. Copy this file as 'api.conf' and customize values
#   2. The framework will automatically load this configuration
#   3. Environment variables can override values using ${VAR_NAME} syntax
#
# Example: 
#   base_url: ${AUTH_BASE_URL:-http://localhost:8085}

# =============================================================================
# GENERAL CONFIGURATION
# =============================================================================
general:
  # Execution environment (dev, test, staging, prod)
  environment: dev
  
  # Default timeout for API requests in milliseconds
  timeout: 30000
  
  # Default User-Agent header for HTTP requests
  user_agent: "SocialSeed-E2E-Agent/2.0"
  
  # Verification level: strict | normal | relaxed
  # strict: All assertions must pass
  # normal: Critical assertions only
  # relaxed: Log warnings but continue on non-critical failures
  verification_level: strict
  
  # Enable verbose logging during test execution
  verbose: true
  
  # Project metadata
  project:
    name: "SocialSeed"
    version: "0.1.0-SNAPSHOT"

# =============================================================================
# API GATEWAY CONFIGURATION (Optional)
# =============================================================================
# If using an API Gateway, configure it here. All service requests will be
# routed through this gateway instead of direct service connections.
#
# When api_gateway is enabled, the framework will:
#   - Use gateway_url as the base for all requests
#   - Append service paths from 'services' section
#   - Add authentication headers if specified

api_gateway:
  # Enable/disable API Gateway mode
  enabled: false
  
  # Base URL of the API Gateway
  url: "http://localhost:8080"
  
  # Path prefix for all requests (e.g., /api/v1)
  prefix: ""
  
  # Authentication for gateway (if required)
  auth:
    type: "none"  # Options: none, bearer, api_key, basic
    # bearer_token: "${GATEWAY_TOKEN}"
    # api_key_header: "X-API-Key"
    # api_key_value: "${API_KEY}"

# =============================================================================
# SERVICE CONFIGURATIONS
# =============================================================================
# Configure each microservice endpoint. These can be used:
#   - Directly (when api_gateway.enabled = false)
#   - As path mappings (when api_gateway.enabled = true)

services:
  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  auth:
    # Service display name
    name: "auth-service"
    
    # Base URL (used for direct connections)
    # Supports environment variable substitution: ${VAR:-default}
    base_url: ${AUTH_BASE_URL:-http://localhost:8085/auth}
    
    # Health check endpoint (relative to base_url)
    health_endpoint: "/actuator/health"
    
    # Service port (for automatic startup)
    port: 8085
    
    # Maven module name (for mvn spring-boot:run)
    maven_module: "services/auth-service"
    
    # Timeout override for this service (ms)
    timeout: 5000
    
    # Custom headers for this service
    headers:
      X-Service-Name: "auth"
    
    # Whether to start automatically if not running
    auto_start: true
    
    # Required for tests to proceed
    required: true
    
    # API endpoints (relative to base_url)
    endpoints:
      login: "/login"
      register: "/register"
      logout: "/logout"
      refresh: "/token/refresh"
      change_password: "/{user_id}/change-password"
      forgot_password: "/forgot-password"
      reset_password: "/reset-password"
      verify_email: "/verify-email"
      change_username: "/username"
      change_email: "/change-email"
      resend_verification: "/resend-verification"
      get_user_by_email: "/getUserByEmail/{email}"
      get_user_by_username: "/getUserByUserName/{username}"

  # ---------------------------------------------------------------------------
  # Social User Service
  # ---------------------------------------------------------------------------
  socialuser:
    name: "socialuser-service"
    base_url: ${SOCIALUSER_BASE_URL:-http://localhost:8090}
    health_endpoint: "/actuator/health"
    port: 8090
    maven_module: "services/socialuser-service"
    timeout: 5000
    headers:
      X-Service-Name: "socialuser"
    auto_start: false  # Optional for auth tests
    required: false

  # ---------------------------------------------------------------------------
  # Template for new services
  # ---------------------------------------------------------------------------
  # myservice:
  #   name: "myservice"
  #   base_url: ${MYSERVICE_BASE_URL:-http://localhost:8086}
  #   health_endpoint: "/actuator/health"
  #   port: 8086
  #   maven_module: "services/myservice"
  #   timeout: 5000
  #   auto_start: true
  #   required: true

# =============================================================================
# DATABASE CONFIGURATIONS
# =============================================================================
# Connection settings for test data verification

databases:
  # PostgreSQL (for Auth service verification)
  postgres:
    host: ${POSTGRES_HOST:-localhost}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DB:-authdb}
    username: ${POSTGRES_USER:-authuser}
    password: ${POSTGRES_PASSWORD:-authpass}
    enabled: false  # Enable for DB validation tests

  # Neo4j (for Social Graph verification)
  neo4j:
    uri: ${NEO4J_URI:-bolt://localhost:7687}
    username: ${NEO4J_USER:-neo4j}
    password: ${NEO4J_PASSWORD:-neoSocial}
    enabled: false  # Enable for graph validation tests

# =============================================================================
# KAFKA CONFIGURATION
# =============================================================================
# Message broker settings for event-driven test scenarios

kafka:
  bootstrap_servers: ${KAFKA_HOST:-localhost}:${KAFKA_PORT:-9092}
  enabled: false  # Enable for event validation tests
  topics:
    user_created: "user-created"
    user_updated: "user-updated"
    user_deleted: "user-deleted"

# =============================================================================
# TEST DATA CONFIGURATION
# =============================================================================
# Default values for test data generation

test_data:
  # User credentials defaults
  user:
    email_domain: "test.socialseed.com"
    password: "StrongPass123!"
    username_prefix: "testuser"
  
  # Timing settings
  timing:
    # Wait time between test steps (ms)
    step_delay: 100
    # Maximum time to wait for async operations (ms)
    async_timeout: 10000
  
  # Retry configuration
  retries:
    max_attempts: 3
    backoff_ms: 1000

# =============================================================================
# REPORTING CONFIGURATION
# =============================================================================
# Test result reporting and output formats

reporting:
  # Output format: console | json | html | all
  format: "console"
  
  # Save detailed logs
  save_logs: true
  
  # Log directory (relative to verify_services/)
  log_dir: "./logs"
  
  # Include request/response bodies in logs (caution: may contain sensitive data)
  include_payloads: false
  
  # Screenshot on failure (if applicable)
  screenshot_on_failure: false

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# SSL/TLS and authentication settings

security:
  # SSL verification (disable only for local testing with self-signed certs)
  verify_ssl: true
  
  # Certificate paths (if using custom certs)
  # ssl_cert: "/path/to/cert.pem"
  # ssl_key: "/path/to/key.pem"
  # ssl_ca: "/path/to/ca.pem"
  
  # Test JWT tokens (for development only - do not commit real tokens!)
  test_tokens:
    admin: "${ADMIN_TEST_TOKEN}"
    user: "${USER_TEST_TOKEN}"
