services:
  #Api-Gateway
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8084:4004"
    depends_on:
      socialuser-service:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4004/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20

  #SocialUser - Service
  socialuser-service:
    container_name: socialuser-service
    build:
      context: .
      dockerfile: services/socialuser-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net

  #Auth - Service
  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4005/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20

  ## ==> DATABASES
  # Social Graph in Neo4j
  neo4j:
    container_name: socialgraph-db
    image: neo4j:5.26.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    #    restart: always
    environment:
      - NEO4J_AUTH=neo4j/neoSocial
      - NEO4J_server.memory.pagecache.size=1G
    volumes:
      - socialgraph_data:/var/lib/neo4j/data
    healthcheck:
      # ping via cypher-shell
      test: [ "CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net

  # Auth database for auth-service
  auth-db:
    container_name: auth-db
    image: postgres:17
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    ports:
      - "5432:5432"
    networks:
      - net
    volumes:
      - /home/dairon/db_volumes/postgres_data/:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authuser -d authdb" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ## Kafka Server-Service
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    hostname: kafka
    networks:
      - net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infrastructure/kafka/kraft/server.properties:/opt/kafka/config/kraft/server.properties
      - ./infrastructure/kafka/topics-init.sh:/scripts/topics-init.sh
      - ./infrastructure/kafka/start-kafka.sh:/scripts/start-kafka.sh
    entrypoint: [ "/scripts/start-kafka.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  socialgraph_data:
    driver: local
  kafka_data:

networks:
  net: