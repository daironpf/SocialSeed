services:
  #SocialUser-Service
  socialuser-service:
    container_name: socialuser-service
    build:
      context: ./socialuser-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./socialuser-service/src:/app/src
      - ./socialuser-service/pom.xml:/app/pom.xml
      - maven_repo:/root/.m2
    environment:
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: ".reloadtrigger"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net

  #Api-Gateway
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8085:4004"
    depends_on:
      socialuser-service:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4004/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./auth-service/src:/app/src
      - ./auth-service/pom.xml:/app/pom.xml
      - maven_repo:/root/.m2
    environment:
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: ".reloadtrigger"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4005/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net

  # Auth database for auth-service
  auth-db:
    container_name: auth-db
    image: postgres:17
#    restart: always
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    ports:
      - "5433:5432"
#    volumes:
#      - D:\db_volumes\auth-db:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authuser -d authdb" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Noe4j database
  neo4j:
    container_name: socialgraph-db
    image: neo4j:5.26.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
#    restart: always
    environment:
      - NEO4J_AUTH=neo4j/neoSocial
      - NEO4J_server.memory.pagecache.size=1G
    volumes:
      - D:\db_volumes\socialgraph-db:/var/lib/neo4j/data
    healthcheck:
      # ping via cypher-shell
      test: [ "CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net

  # Kafka Server-Service
  kafka-service:
    image: apache/kafka:4.0.1
    container_name: kafka-service
    networks:
      - net
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-service:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
      KAFKA_LOG_DIRS: /tmp/kafka-combined.logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-service:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  maven_repo:

networks:
  net: