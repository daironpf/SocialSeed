services:
  #Api-Gateway
  api-gateway:
    container_name: api-gateway
    build:
      context: services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8084:4004"
    depends_on:
      socialuser-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4004/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  #SocialUser - Service
  socialuser-service:
    container_name: socialuser-service
    build:
      context: .
      dockerfile: services/socialuser-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8090
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - net
    volumes:
      - ./services/socialuser-service/src/main/resources/application.yml:/app/config/application.yml:ro
      - ./services/socialuser-service/src/main/resources/application-dev.yml:/app/config/application-dev.yml:ro
      - ./services/socialuser-service/src/main/resources/application-docker.yml:/app/config/application-docker.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  #Auth - Service
  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_PORT: 8085
      SPRING_GRPC_CLIENT_USER_ADDRESS: socialuser-service:9090
      SPRING_GRPC_CLIENT_CHANNELS_USER_ADDRESS: socialuser-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - net
    volumes:
      - ./services/auth-service/src/main/resources/application.yml:/app/config/application.yml:ro
      - ./services/auth-service/src/main/resources/application-dev.yml:/app/config/application-dev.yml:ro
      - ./services/auth-service/src/main/resources/application-docker.yml:/app/config/application-docker.yml:ro
    deploy:
      resources:
        limits:
          memory: 512M

  #Nexus - Service
  nexus-service:
    container_name: nexus-service
    build:
      context: .
      dockerfile: services/nexus-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: test
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    networks:
      - net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  ## ==> DATABASES
  # Social Graph in Neo4j
  neo4j:
    container_name: socialgraph-db
    image: neo4j:5.26.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    #    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neoSocial}
      - NEO4J_server.memory.pagecache.size=1G
    volumes:
      - ./infrastructure/volumes/neo4j_data:/var/lib/neo4j/data
    healthcheck:
      # ping via cypher-shell
      test: [ "CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - net
    deploy:
      resources:
        limits:
          memory: 512M

  # Auth database for auth-service
  auth-db:
    container_name: auth-db
    image: postgres:17
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authpass}
    ports:
      - "5433:5432"
    networks:
      - net
    volumes:
      - ./infrastructure/volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authuser -d authdb" ]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  # Token blacklist and cache in Redis
  redis:
    container_name: redis
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./infrastructure/volumes/redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  ## Kafka Server-Service
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    hostname: kafka
    networks:
      - net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    volumes:
      - ./infrastructure/volumes/kafka_data:/var/lib/kafka/data
      - ./infrastructure/kafka/topics-init.sh:/usr/local/bin/topics-init.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    command: >
      bash -c "/usr/local/bin/topics-init.sh kafka:9092 || true
      /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties"

networks:
  net:
