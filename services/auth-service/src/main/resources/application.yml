server:
  port: 8085

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: auth-service
  # PgSQL auth-db
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: authuser
    password: authpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  # Grpc Client
  grpc:
    server:
      enabled: false
    client:
      channels:
        user:
          address: ${SPRING_GRPC_CLIENT_CHANNELS_USER_ADDRESS:static://localhost:9090}
          enableKeepAlive: true
          keepAliveWithoutCalls: true
          negotiationType: plaintext
        socialuser-service:
          address: ${SPRING_GRPC_CLIENT_CHANNELS_SOCIALUSER_ADDRESS:static://localhost:9090}
  # Kafka emiter
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    properties:
      spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

kafka:
  topic:
    auth-user-registered: auth.user.registered

security:
  admin:
    default-id: ${ADMIN_DEFAULT_ID:00000000-0000-0000-0000-000000000001}

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnly12345678901234567890}
  expiration: 3600000
  jwks-path: /.well-known/jwks.json
  access-token-ttl: 900 # seconds
  refresh:
    expiration: 2592000 # 30 days