server:
  port: 8090
  #port: 4005

logging:
  level:
    root: info
    org.springframework.context.support: DEBUG


# ======================
# Neo4j Configuration (Aura Cloud)
# ======================
spring:
  messages:
    basename: messages
    encoding: UTF-8
  application:
    name: socialuser-service
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: neo4j
      password: neoSocial
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: socialuser-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
    listener:
      auto-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health

# ======================
# Grpc
# ======================
grpc:
  server:
    port: 9090
    reflection-service-enabled: true
    security:
      enabled: false

