server:
  port: 8090
  #port: 4005

logging:
  level:
    root: info
    org.springframework.context.support: DEBUG


# ======================
# Neo4j Configuration (Aura Cloud)
# ======================
spring:
  messages:
    basename: messages
    encoding: UTF-8
  application:
    name: socialuser-service
  neo4j:
    uri: bolt://socialgraph-db:7687
    authentication:
      username: neo4j
      password: neoSocial

management:
  endpoints:
    web:
      exposure:
        include: health

# ======================
# Grpc
# ======================
grpc:
  server:
    port: 9090
    reflection-service-enabled: true
    security:
      enabled: false

