syntax = "proto3";

// Definimos el package lógico de protobuf
package com.socialseed.contracts.socialuser;

// CONFIGURACIÓN PARA JAVA
option java_multiple_files = true;
// Cambiamos el paquete para que apunte a tu librería de contratos centralizada
option java_package = "com.socialseed.contracts.socialuser";
option java_outer_classname = "SocialUserProto";

/**
 * Servicio gRPC que expone las operaciones del SocialUserService
 */
service SocialUserService {
    // Crea un usuario con username y email
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

    // Actualiza el username de un usuario existente
    rpc UpdateUsername(UpdateUsernameRequest) returns (UpdateUsernameResponse);

    // Actualiza el email de un usuario existente
    rpc UpdateEmail(UpdateEmailRequest) returns (UpdateEmailResponse);
}

/**
 * Mensaje para la creación de usuario
 */
message CreateUserRequest {
    string username = 1;
    string email = 2;
}

/**
 * Respuesta del servicio de usuario
 * Cambiamos 'Reply' por 'Response' para mantener consistencia con Auth
 */
message CreateUserResponse {
    string user_id = 1;       // UUID generado (convención snake_case)
    string message = 2;      // Mensaje de confirmación
}

/**
 * Mensaje para actualizar el username
 */
message UpdateUsernameRequest {
    string user_id = 1;
    string new_username = 2;
}

/**
 * Respuesta para actualizar el username
 */
message UpdateUsernameResponse {
    bool success = 1;
    string message = 2;
}

/**
 * Mensaje para actualizar el email
 */
message UpdateEmailRequest {
    string user_id = 1;
    string new_email = 2;
}

/**
 * Respuesta para actualizar el email
 */
message UpdateEmailResponse {
    bool success = 1;
    string message = 2;
}