syntax = "proto3";

package com.socialseed.contracts.socialuser.events;

option java_multiple_files = true;
option java_package = "com.socialseed.contracts.socialuser.events";
option java_outer_classname = "SocialUserEventsProto";

import "google/protobuf/timestamp.proto";

message SocialUserCreated {
    string user_id = 1;
    string email = 2;
    string username = 3;
    google.protobuf.Timestamp created_at = 4;
}

message SocialUserProfileUpdated {
    string user_id = 1;
    google.protobuf.Timestamp updated_at = 2;
}

message SocialUserVacationStarted {
    string user_id = 1;
    google.protobuf.Timestamp started_at = 2;
}

message SocialUserVacationEnded {
    string user_id = 1;
    google.protobuf.Timestamp ended_at = 2;
}
