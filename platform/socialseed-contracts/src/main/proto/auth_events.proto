syntax = "proto3";

// Package lógico para evitar colisiones
package com.socialseed.contracts.auth.events;

// CONFIGURACIÓN PARA JAVA
option java_multiple_files = true;
option java_package = "com.socialseed.contracts.auth.events";
option java_outer_classname = "AuthEventsProto";

import "google/protobuf/timestamp.proto";

/**
 * Evento enviado al topic: auth.user.registered
 * Representa la creación de un nuevo usuario en el sistema de autenticación.
 */
message AuthUserRegistered {
    string user_id = 1;      // Protobuf usa snake_case por convención
    string email = 2;
    string username = 3;
    google.protobuf.Timestamp created_at = 4;
}

/**
 * Evento enviado al topic: auth.user.username.changed
 * Representa el cambio de username de un usuario.
 */
message AuthUserUsernameChanged {
    string user_id = 1;
    string old_username = 2;
    string new_username = 3;
    google.protobuf.Timestamp updated_at = 4;
}

/**
 * Evento enviado al topic: auth.user.email.changed
 * Representa el cambio de email de un usuario.
 */
message AuthUserEmailChanged {
    string user_id = 1;
    string old_email = 2;
    string new_email = 3;
    google.protobuf.Timestamp updated_at = 4;
}

/**
 * Evento enviado al topic: auth.user.email.verified
 * Representa que un usuario ha verificado exitosamente su email.
 */
message AuthUserEmailVerified {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp verified_at = 3;
}

/**
 * Evento enviado al topic: auth.user.role.assigned
 * Representa la asignación de un rol a un usuario.
 */
message AuthUserRoleAssigned {
    string user_id = 1;
    string email = 2;
    string username = 3;
    string role = 4;
    string assigned_by = 5;  // ID del admin que asignó el rol
    google.protobuf.Timestamp assigned_at = 6;
}

/**
 * Evento enviado al topic: auth.user.role.removed
 * Representa la remoción de un rol de un usuario.
 */
message AuthUserRoleRemoved {
    string user_id = 1;
    string email = 2;
    string username = 3;
    string role = 4;
    string removed_by = 5;  // ID del admin que removió el rol
    google.protobuf.Timestamp removed_at = 6;
}