syntax = "proto3";

package com.socialseed.contracts.auth.events;

option java_multiple_files = true;
option java_package = "com.socialseed.contracts.auth.events";
option java_outer_classname = "AuthEventsProto";

import "google/protobuf/timestamp.proto";

message AuthUserRegistered {
    string user_id = 1;
    string email = 2;
    string username = 3;
    google.protobuf.Timestamp created_at = 4;
}

message AuthUserUsernameChanged {
    string user_id = 1;
    string old_username = 2;
    string new_username = 3;
    google.protobuf.Timestamp updated_at = 4;
}

message AuthUserEmailChanged {
    string user_id = 1;
    string old_email = 2;
    string new_email = 3;
    google.protobuf.Timestamp updated_at = 4;
}

message AuthUserEmailVerified {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp verified_at = 3;
}

message AuthUserRoleAssigned {
    string user_id = 1;
    string email = 2;
    string username = 3;
    string role = 4;
    string assigned_by = 5;
    google.protobuf.Timestamp assigned_at = 6;
}

message AuthUserRoleRemoved {
    string user_id = 1;
    string email = 2;
    string username = 3;
    string role = 4;
    string removed_by = 5;
    google.protobuf.Timestamp removed_at = 6;
}

message AuthPasswordChanged {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp changed_at = 3;
}

message AuthPasswordReset {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp requested_at = 3;
}

message AuthAccountLocked {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp locked_at = 3;
}

message AuthAccountUnlocked {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp unlocked_at = 3;
}

message AuthUserLoggedIn {
    string user_id = 1;
    string email = 2;
    string username = 3;
    google.protobuf.Timestamp logged_in_at = 4;
}

message AuthUserLoggedOut {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp logged_out_at = 3;
}

message AuthRefreshTokenRevoked {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp revoked_at = 3;
}

message AuthAllSessionsRevoked {
    string user_id = 1;
    string email = 2;
    google.protobuf.Timestamp revoked_at = 3;
}
