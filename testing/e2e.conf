# SocialSeed E2E Configuration
# Documentation: https://github.com/daironpf/socialseed-e2e

general:
  environment: dev
  timeout: 30000
  verbose: true
  user_agent: socialseed-e2e/1.0
  project_name: my-project

services:
  auth:
    base_url: http://localhost:8085
    health_endpoint: /actuator/health
    required: true
