server:
  port: 4004

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: socialuser-route
              uri: http://socialuser-dev:4000
              predicates:
                - Path=/api/socialusers/**
              filters:
                - StripPrefix=1
              # REST CLIENT -> http://localhost:8081/api/socialusers
              # API GATEWAY -> http://socialuser-service:4000/socialusers